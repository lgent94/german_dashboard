<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verben - Notizbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#e7eef2;--sheet:#fffefd;--ink:#17313a;--ink-soft:#61737a;--rule:#d5e0e3;--accent:#087e8b;--accent-dark:#05636e;--coral:#df735f;--flag:#9b6a16}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:linear-gradient(135deg,#d9e8e9 0%,var(--paper) 44%,#f2e6d7 100%);color:var(--ink);font-family:"IBM Plex Sans",sans-serif;font-size:16px;line-height:1.45;min-height:100vh}
  .sheet{max-width:1040px;margin:32px auto;background:var(--sheet);min-height:calc(100vh - 64px);border:1px solid rgba(23,49,58,.1);border-radius:8px;box-shadow:0 18px 48px rgba(28,59,68,.12);padding:clamp(24px,5vw,56px) clamp(18px,5vw,64px) 56px}
  header{position:relative;padding-bottom:22px;border-bottom:1px solid var(--rule)}header::after{content:"";position:absolute;bottom:-2px;left:0;width:72px;height:3px;background:var(--coral)}
  h1{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(32px,6vw,44px);font-weight:600;letter-spacing:0;margin:0 0 4px;color:var(--accent-dark)}
  .sub,.count,footer{color:var(--ink-soft);font-size:14px;margin:0}
  .nav{display:flex;gap:4px;margin:20px 0 0;font-size:13px}.nav a{color:var(--ink-soft);text-decoration:none;padding:7px 12px;border-radius:4px;font-weight:600}.nav a:hover{background:#eef5f4;color:var(--accent-dark)}.nav a[aria-current="page"]{background:var(--accent);color:#fff}
  .controls,.pages{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px;padding:14px;background:#f3f7f7;border:1px solid var(--rule);border-radius:6px}.pages{margin-top:0;padding:16px 0 14px;background:transparent;border-inline:0;border-top:0;border-radius:0;border-bottom:1px solid var(--rule)} .pages span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-right:6px}
  button,input{font:inherit;font-size:13px} button{font-weight:500;background:transparent;color:var(--ink);border:1px solid #bdcfd2;border-radius:4px;padding:7px 11px;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
  button:hover{border-color:var(--accent);color:var(--accent-dark);background:#fff} button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type="search"]{padding:7px 10px;border:1px solid #bdcfd2;border-radius:4px;background:#fff;color:var(--ink);width:210px;margin-left:auto}
  ol{list-style:none;margin:0;padding:0} li{display:grid;grid-template-columns:34px 1.2fr 1fr 1.1fr 1.1fr;gap:0 14px;align-items:baseline;padding:14px 12px 12px;border-bottom:1px solid var(--rule);transition:background .15s ease}li:hover{background:#f6fbfa}li:first-child{margin-top:4px}
  li.known .form,li.known .gloss{opacity:.42}.num{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;background:#edf3f4;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}.num:hover{color:#fff;background:var(--accent)}
  li.known .num{background:#e5f2e8}li.known .num::after{content:"\2713";margin-left:2px;color:#398055}.form{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.3}.gloss{color:var(--ink);font-size:15px;padding-top:2px}
  .label{font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}.missing{color:var(--ink-soft);font-style:italic}.note{grid-column:2 / -1;font-size:13px;color:var(--flag);font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin-top:3px;padding-left:11px;border-left:2px solid var(--flag)}
  .message{padding:32px 0;color:var(--ink-soft);font-size:14px}.message code{font-family:ui-monospace,monospace;background:var(--paper);padding:2px 5px;border-radius:2px}
  body.quiz .form,body.quiz .gloss{color:transparent;background:linear-gradient(var(--rule),var(--rule)) left bottom / 100% 1px no-repeat;cursor:pointer;min-height:1.4em}body.quiz li.shown .form,body.quiz li.shown .gloss{color:var(--ink);background:none}body.quiz .note{display:none}body.quiz li.shown .note{display:block}
  .column-headings{display:grid;grid-template-columns:34px 1.2fr 1fr 1.1fr 1.1fr;gap:14px;padding:14px 12px 7px;border-bottom:1px solid var(--rule);color:var(--ink-soft);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.count{margin:18px 0 0;text-align:right}footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule)}@media(max-width:700px){.sheet{margin:0;border:0;border-radius:0;min-height:100vh;box-shadow:none}.controls{padding:10px}.controls button{flex:1 0 auto}.column-headings{display:none}li{grid-template-columns:30px 1fr;gap:5px 14px;padding-block:16px}.num{grid-row:1 / span 4;align-self:start}.form,.gloss{grid-column:2;display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline;padding:0;margin:0}.form::before,.gloss::before{color:var(--ink-soft);font:600 10px "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase}.infinitive::before{content:"Infinitive"}.preterite::before{content:"Präteritum"}.participle::before{content:"Partizip II"}.meaning::before{content:"English"}body.quiz .form::before,body.quiz .gloss::before{color:var(--ink-soft)}input[type="search"]{width:100%;margin-left:0}}@media(prefers-reduced-motion:no-preference){.form,.gloss{transition:color .12s ease}}
</style>
</head>
<body>
<main class="sheet">
  <header><h1 id="title">Verben</h1><p class="sub" id="subtitle">Loading verbs...</p><nav class="nav" aria-label="Study sets"><a href="index.html">Wortschatz</a><a href="verbs.html" aria-current="page">Verben</a><a href="irregular-verbs.html">Irregular drill</a></nav></header>
  <div class="controls"><button id="quiz" aria-pressed="false">Quiz mode</button><button id="shuffle">Shuffle</button><button id="reset">Reset order</button><button id="csv">Download CSV</button><input type="search" id="search" placeholder="Search German or English"></div>
  <div class="pages" id="pages"><span>Pages</span></div>
  <div class="column-headings" aria-hidden="true"><span></span><span>Infinitive</span><span>Präteritum</span><span class="participle">Partizip II</span><span class="meaning">English</span></div>
  <ol id="list"></ol><p class="count"><span id="knownCount">0</span> of <span id="total">0</span> marked known</p>
  <footer>Click a number to mark a verb known. In quiz mode, click a row to reveal its forms.</footer>
</main>
<script>
var DATA=[],PAGES=[],order=[],activePage=0,query="",known=new Set();
var list=document.getElementById("list");
function fail(err){list.innerHTML='<p class="message">Could not load <code>verbs.json</code>. Serve this folder over http, for example with <code>python3 -m http.server</code>.<br><br>Details: '+String(err)+"</p>";document.getElementById("subtitle").textContent="";}
fetch("verbs.json",{cache:"no-store"}).then(function(response){if(!response.ok)throw new Error("HTTP "+response.status);return response.json();}).then(function(doc){DATA=doc.entries||[];PAGES=doc.pages||[];document.getElementById("title").textContent=doc.title||"Verben";document.getElementById("subtitle").textContent=DATA.length+" verbs. "+(doc.subtitle||"");document.getElementById("total").textContent=DATA.length;order=DATA.map(function(_,index){return index;});buildPages();loadKnown();render();}).catch(fail);
function buildPages(){var wrap=document.getElementById("pages");function add(label,index){var button=document.createElement("button");button.textContent=label;button.setAttribute("aria-pressed",index===activePage);button.onclick=function(){activePage=index;Array.prototype.forEach.call(wrap.querySelectorAll("button"),function(item){item.setAttribute("aria-pressed",item===button);});render();};wrap.append(button);}add("All",0);PAGES.forEach(function(page,index){add(page[0]+"-"+page[1],index+1);});}
function visible(verb){if(activePage>0){var page=PAGES[activePage-1];if(verb.n<page[0]||verb.n>page[1])return false;}return !query||[verb.infinitive,verb.preterite,verb.participle,verb.en].join(" ").toLowerCase().indexOf(query)!==-1;}
function text(value,name){var span=document.createElement("span");span.textContent=value||"-";span.className=(value?"form ":"form missing ")+name;return span;}
function render(){list.innerHTML="";var shown=0;order.forEach(function(index){var verb=DATA[index];if(!visible(verb))return;shown++;var li=document.createElement("li");li.dataset.index=index;if(known.has(verb.n))li.classList.add("known");var number=document.createElement("span");number.className="num";number.textContent=verb.n;number.tabIndex=0;number.setAttribute("role","button");number.setAttribute("aria-label","Mark "+verb.infinitive+" known");var infinitive=text(verb.infinitive,"infinitive");var preterite=text(verb.preterite,"preterite");var participle=text(verb.participle,"participle");var gloss=document.createElement("span");gloss.className=(verb.en?"gloss ":"gloss missing ")+"meaning";gloss.textContent=verb.en||"-";li.append(number,infinitive,preterite,participle,gloss);if(verb.note){var note=document.createElement("span");note.className="note";note.textContent=verb.note;li.append(note);}list.append(li);});if(!shown)list.innerHTML='<p class="message">No verbs match. Clear the search or pick another page.</p>';document.getElementById("knownCount").textContent=known.size;}
list.addEventListener("click",function(event){var li=event.target.closest("li");if(!li)return;if(event.target.classList.contains("num")){var n=DATA[li.dataset.index].n;if(known.has(n))known.delete(n);else known.add(n);li.classList.toggle("known");document.getElementById("knownCount").textContent=known.size;saveKnown();return;}if(document.body.classList.contains("quiz"))li.classList.toggle("shown");});
list.addEventListener("keydown",function(event){if((event.key==="Enter"||event.key===" ")&&event.target.classList.contains("num")){event.preventDefault();event.target.click();}});
document.getElementById("quiz").onclick=function(){var on=document.body.classList.toggle("quiz");this.setAttribute("aria-pressed",on);Array.prototype.forEach.call(document.querySelectorAll("li.shown"),function(li){li.classList.remove("shown");});};
document.getElementById("shuffle").onclick=function(){for(var index=order.length-1;index>0;index--){var other=Math.floor(Math.random()*(index+1));var current=order[index];order[index]=order[other];order[other]=current;}render();};
document.getElementById("reset").onclick=function(){order=DATA.map(function(_,index){return index;});render();};document.getElementById("search").addEventListener("input",function(event){query=event.target.value.trim().toLowerCase();render();});
document.getElementById("csv").onclick=function(){function escape(value){return '"'+String(value||"").replace(/"/g,'""')+'"';}var rows=[["n","infinitive","preterite","participle","english"].map(escape).join(",")];DATA.forEach(function(verb){rows.push([verb.n,verb.infinitive,verb.preterite,verb.participle,verb.en].map(escape).join(","));});var blob=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});var link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="verben.csv";link.click();URL.revokeObjectURL(link.href);};
function saveKnown(){try{localStorage.setItem("verben:known",JSON.stringify(Array.from(known)));}catch(error){}}function loadKnown(){try{var raw=localStorage.getItem("verben:known");if(raw)JSON.parse(raw).forEach(function(n){known.add(n);});}catch(error){}}
</script>
</body>
</html>
